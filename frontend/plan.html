<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Travel Plan - Your Itinerary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --bg1:#0f0c29;
      --bg2:#302b63;
      --bg3:#24243e;
      --glass: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.72);
      --accent:#00d4ff;
      --accent2:#7c3aed;
      --gold:#ffd700;
      --shadow: 0 22px 55px rgba(0,0,0,.55);
      --shadow2: 0 12px 35px rgba(0,0,0,.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    }

    /* ================= BACKGROUND: INDIA PLACES SLIDESHOW ================= */
    .bg-slideshow{
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background: #0b0b18;
    }
    .bg-slideshow::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(0,212,255,.16), transparent 55%),
        radial-gradient(1000px 600px at 85% 30%, rgba(124,58,237,.16), transparent 55%),
        linear-gradient(135deg, rgba(15,12,41,.90), rgba(48,43,99,.78), rgba(36,36,62,.90));
      backdrop-filter: blur(2px);
    }
    .bg-slide{
      position:absolute;
      inset:-10%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.08);
      filter: saturate(1.15) contrast(1.05);
      animation: bgFade 36s infinite;
    }
    @keyframes bgFade{
      0%{opacity:0}
      5%{opacity:1}
      20%{opacity:1}
      25%{opacity:0}
      100%{opacity:0}
    }
    .s1{ animation-delay: 0s;  background-image:url("https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=2400&q=70"); }
    .s2{ animation-delay: 6s;  background-image:url("https://images.unsplash.com/photo-1599661046289-e31897846e41?auto=format&fit=crop&w=2400&q=70"); }
    .s3{ animation-delay: 12s; background-image:url("https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=2400&q=70"); }
    .s4{ animation-delay: 18s; background-image:url("https://images.unsplash.com/photo-1506197603052-3cc9c3a201bd?auto=format&fit=crop&w=2400&q=70"); }
    .s5{ animation-delay: 24s; background-image:url("https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=2400&q=70"); }
    .s6{ animation-delay: 30s; background-image:url("https://images.unsplash.com/photo-1570168007204-dfb528c6958f?auto=format&fit=crop&w=2400&q=70"); }

    /* Decorative blobs */
    body::before, body::after{
      content:"";
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(55px);
      opacity: .22;
      z-index: -2;
      animation: floaty 10s ease-in-out infinite;
      pointer-events:none;
    }
    body::before{
      left:-140px;
      top: 120px;
      background: radial-gradient(circle at 30% 30%, rgba(0,212,255,.8), transparent 60%);
    }
    body::after{
      right:-160px;
      top: 280px;
      background: radial-gradient(circle at 30% 30%, rgba(124,58,237,.85), transparent 60%);
      animation-delay: 1.2s;
    }
    @keyframes floaty{
      0%,100%{ transform: translateY(0px) }
      50%{ transform: translateY(-18px) }
    }

    /* ============ NAVBAR ============ */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 42px;
      background: rgba(0,0,0,.45);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      z-index: 1000;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .logo i { color: var(--accent); }
    .nav-actions { display:flex; gap: 10px; align-items:center; }

    .pill-link{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 16px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      color: #fff;
      text-decoration:none;
      transition:.25s;
      font-weight:600;
      font-size:14px;
    }
    .pill-link:hover{ transform: translateY(-2px); background: rgba(255,255,255,.12); }

    /* ============ HEADER ============ */
    .header {
      padding: 110px 42px 26px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .hero{
      display:flex;
      flex-direction: column;
      gap: 14px;
      padding: 24px 24px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow2);
      overflow: hidden;
      position: relative;
    }
    .hero::after{
      content:"";
      position:absolute;
      right:-120px;
      top:-120px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,215,0,.30), transparent 60%);
      filter: blur(14px);
    }

    .header h1 {
      font-size: 40px;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff, #c8f3ff 35%, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 28px rgba(0,212,255,.25);
    }
    .subhead{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      color: rgba(255,255,255,.75);
      font-weight: 500;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      font-size: 13px;
    }
    .chip i{ color: var(--accent); }

    /* ============ LAYOUT ============ */
    .main-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 26px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 42px 70px;
      align-items: start;
    }

    /* Timeline */
    .itinerary-section h2 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #d9fbff;
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .timeline{
      display:flex;
      flex-direction: column;
      gap: 18px;
      padding-left: 6px;
    }
    .day-row{
      display:grid;
      grid-template-columns: 40px 1fr;
      gap: 14px;
      align-items: stretch;
    }
    .marker{
      position: relative;
      display:flex;
      justify-content:center;
    }
    .marker::before{
      content:"";
      position:absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, rgba(0,212,255,.6), rgba(124,58,237,.25));
      opacity: .65;
    }
    .dot{
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 25px rgba(0,212,255,.18);
      border: 1px solid rgba(255,255,255,.16);
      margin-top: 10px;
      z-index: 1;
    }

    .day-card{
      background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      overflow:hidden;
      box-shadow: var(--shadow2);
      transition: .25s;
    }
    .day-card:hover{ transform: translateY(-4px); box-shadow: var(--shadow); }

    .day-top{
      display:flex;
      gap: 14px;
      padding: 16px 16px 12px;
      background: linear-gradient(135deg, rgba(0,0,0,.25), rgba(0,0,0,.10));
      border-bottom: 1px solid rgba(255,255,255,.10);
      align-items:center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .title-wrap{
      display:flex;
      flex-direction: column;
      gap: 4px;
      min-width: 220px;
    }
    .place-title{
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .mini{
      color: rgba(255,255,255,.70);
      font-size: 13px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .badge-budget{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,215,0,.12);
      border: 1px solid rgba(255,215,0,.18);
      color: #ffe792;
      font-weight: 700;
      font-size: 13px;
    }

    .day-body{
      display:grid;
      grid-template-columns: 190px 1fr;
      gap: 14px;
      padding: 14px 16px 16px;
    }

    .thumb{
      width: 190px;
      height: 132px;
      border-radius: 16px;
      overflow:hidden;
      position:relative;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transform: scale(1.02);
    }
    .thumb::after{
      content:"";
      position:absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.65), transparent 55%);
      opacity: .9;
    }
    .thumb .thumb-label{
      position:absolute;
      left: 10px;
      bottom: 10px;
      z-index: 1;
      font-weight: 700;
      font-size: 12px;
      color: rgba(255,255,255,.92);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
    }

    .detail{
      display:flex;
      flex-direction: column;
      gap: 10px;
    }
    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .info{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      padding: 10px 12px;
      display:flex;
      gap: 10px;
      align-items:flex-start;
      min-height: 54px;
    }
    .info i{
      color: var(--accent);
      margin-top: 2px;
      width: 18px;
    }
    .info .k{
      font-size: 12px;
      color: rgba(255,255,255,.65);
      font-weight: 600;
    }
    .info .v{
      font-size: 13px;
      color: rgba(255,255,255,.92);
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }

    .desc{
      color: rgba(255,255,255,.74);
      line-height: 1.7;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
    }

    /* ============ SIDEBAR ============ */
    .sidebar { position: sticky; top: 86px; display:flex; flex-direction: column; gap: 14px; }

    #map{
      width:100%;
      height: 320px;
      border-radius: 20px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow2);
      background: rgba(255,255,255,.06);
    }

    .side-card{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow2);
    }
    .side-title{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: 800;
      color: #d9fbff;
    }
    .side-title small{
      color: rgba(255,255,255,.55);
      font-weight: 600;
    }
    .big-money{
      font-size: 34px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      -webkit-background-clip:text;
      -webkit-text-fill-color: transparent;
      letter-spacing: .2px;
    }
    .meta{
      display:flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: rgba(255,255,255,.72);
      font-size: 13px;
    }
    .meta span i{ color: var(--accent); margin-right: 6px; }

    .action-btn{
      width:100%;
      padding: 14px 14px;
      border-radius: 16px;
      border: 0;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      transition: .22s;
      color: #fff;
    }
    .action-btn:hover{ transform: translateY(-2px); }
    .download-btn{
      background: linear-gradient(135deg, #ff5f6d, #ff9966);
    }
    .new-plan-btn{
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .loading{
      display:flex;
      flex-direction: column;
      align-items:center;
      justify-content:center;
      min-height: 340px;
      text-align:center;
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
    }
    .spinner{
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.12);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error{
      padding: 32px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,95,109,.10);
    }
    .error h3{ margin-bottom: 8px; }
    .error p{ color: rgba(255,255,255,.78); }

    @media (max-width: 1024px){
      .main-layout{ grid-template-columns: 1fr; padding: 0 18px 60px; }
      .header{ padding: 100px 18px 22px; }
      .navbar{ padding: 14px 18px; }
      .day-body{ grid-template-columns: 1fr; }
      .thumb{ width:100%; height: 200px; }
      .sidebar{ position: relative; top: 0; }
      .marker::before{ display:none; }
      .day-row{ grid-template-columns: 1fr; }
      .marker{ display:none; }
    }
  </style>
</head>

<body>
  <!-- Background slideshow (India places) -->
  <div class="bg-slideshow" aria-hidden="true">
    <div class="bg-slide s1"></div>
    <div class="bg-slide s2"></div>
    <div class="bg-slide s3"></div>
    <div class="bg-slide s4"></div>
    <div class="bg-slide s5"></div>
    <div class="bg-slide s6"></div>
  </div>

  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-plane-departure"></i>
      <span>Max Travel Buddy</span>
    </div>
    <div class="nav-actions">
      <a class="pill-link" href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
      <a class="pill-link" href="#" onclick="downloadPDF(); return false;"><i class="fas fa-file-arrow-down"></i> PDF</a>
    </div>
  </nav>

  <header class="header">
    <div class="hero">
      <h1 id="heroTitle">Your AI Travel Plan</h1>
      <div class="subhead">
        <span class="chip"><i class="fas fa-location-dot"></i> <span id="fromCity">-</span></span>
        <span class="chip"><i class="fas fa-flag-checkered"></i> <span id="toCity">-</span></span>
        <span class="chip"><i class="fas fa-calendar-days"></i> <span id="tripDays">- days</span></span>
        <span class="chip"><i class="fas fa-wallet"></i> <span id="budgetText">INR 0</span></span>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <section class="itinerary-section">
      <h2><i class="fas fa-route"></i> Day-by-Day Itinerary</h2>

      <div id="itinerary" class="timeline">
        <div class="loading" id="loadingState">
          <div class="spinner"></div>
          <div style="font-weight:800;font-size:18px;margin-bottom:6px;">Creating your itinerary…</div>
          <div style="color:rgba(255,255,255,.65);font-size:13px;">This can take a few seconds</div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div id="map"></div>

      <div class="side-card">
        <div class="side-title">
          <span><i class="fas fa-indian-rupee-sign"></i> Budget</span>
          <small>estimate</small>
        </div>
        <div class="big-money" id="totalCost">INR 0</div>
        <div class="meta" id="tripMeta">
          <span><i class="fas fa-calendar"></i> -</span>
          <span><i class="fas fa-road"></i> -</span>
          <span><i class="fas fa-clock"></i> -</span>
        </div>
      </div>

      <button class="action-btn download-btn" onclick="downloadPDF()">
        <i class="fas fa-download"></i> Download PDF
      </button>

      <button class="action-btn new-plan-btn" onclick="location.href='index.html'">
        <i class="fas fa-plus"></i> Plan New Trip
      </button>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    // ================= AUTH =================
    if (!localStorage.getItem("loggedIn")) {
      window.location.href = "login.html";
    }

    // ================= DATA =================
    const from = localStorage.getItem("from") || "Your City";
    const to = localStorage.getItem("to") || "Destination";
    const days = parseInt(localStorage.getItem("days"), 10) || 3;
    const budget = parseInt(localStorage.getItem("budget"), 10) || 15000;
    const dailyBudget = Math.floor(budget / days);

    document.getElementById("fromCity").textContent = from;
    document.getElementById("toCity").textContent = to;
    document.getElementById("tripDays").textContent = `${days} days`;
    document.getElementById("budgetText").textContent = `INR ${budget.toLocaleString()}`;
    document.getElementById("totalCost").textContent = `INR ${budget.toLocaleString()}`;
    document.getElementById("heroTitle").textContent = `Your AI Travel Plan: ${to}`;

    // ================= MAP =================
    const map = L.map("map").setView([22.9734, 78.6569], 5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

    let markers = [];
    let routeLine = null;

    async function geocode(q) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`;
      const res = await fetch(url);
      const js = await res.json();
      if (!js || js.length === 0) return null;
      return { lat: parseFloat(js[0].lat), lon: parseFloat(js[0].lon) };
    }

    async function updateMapRoute() {
      try {
        const fromGeo = await geocode(from);
        const toGeo = await geocode(to);
        if (!fromGeo || !toGeo) return;

        markers.forEach(m => map.removeLayer(m));
        markers = [];
        if (routeLine) map.removeLayer(routeLine);

        const start = L.marker([fromGeo.lat, fromGeo.lon]).addTo(map).bindPopup(`Start: <b>${from}</b>`);
        const end = L.marker([toGeo.lat, toGeo.lon]).addTo(map).bindPopup(`Destination: <b>${to}</b>`);
        markers.push(start, end);

        routeLine = L.polyline([[fromGeo.lat, fromGeo.lon],[toGeo.lat, toGeo.lon]], {
          color: "#00d4ff", weight: 5, opacity: 0.65
        }).addTo(map);

        map.fitBounds(routeLine.getBounds(), { padding: [18, 18] });

        const distanceKm = map.distance([fromGeo.lat, fromGeo.lon],[toGeo.lat, toGeo.lon]) / 1000;
        const hours = (distanceKm / 60).toFixed(1);

        document.getElementById("tripMeta").innerHTML = `
          <span><i class="fas fa-calendar"></i> ${days} days</span>
          <span><i class="fas fa-road"></i> ${distanceKm.toFixed(0)} km</span>
          <span><i class="fas fa-clock"></i> ${hours} hrs</span>
        `;
      } catch (e) {}
    }

    // ================= PLAN UI =================
    let planData = [];

    function getPlaceImageFallback(place) {
      // Fallback if Wikipedia has no thumbnail
      return `https://source.unsplash.com/900x700/?${encodeURIComponent(place)},india,landmark`;
    }

    function parseHotel(hotelStr) {
      const raw = String(hotelStr || "");
      const cleaned = raw.replaceAll("★", " stars");
      const m = cleaned.match(/^(.*?)\s*\(([\d.]+)\s*(?:stars?)\s*,\s*(.*?)\)\s*$/i);
      if (!m) return { name: raw || "N/A", rating: null, area: null };
      return { name: m[1].trim(), rating: parseFloat(m[2]), area: m[3].trim() };
    }

    // ---------- Wikipedia image loader (place-specific images) ----------
    const placeImgCache = new Map(); // key -> url

    function cacheKey(place) { return `${place} | ${to}`; }

    async function fetchWikipediaThumbnail(place) {
      const query = `${place} ${to} India`;

      // Wikipedia search API (CORS enabled)
      const searchUrl =
        `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}` +
        `&format=json&origin=*`;

      const searchRes = await fetch(searchUrl);
      const searchJson = await searchRes.json();
      const first = searchJson?.query?.search?.[0];
      if (!first?.title) return null;

      // Summary API includes thumbnail often
      const summaryUrl =
        `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(first.title)}`;

      const sumRes = await fetch(summaryUrl);
      const sumJson = await sumRes.json();
      return sumJson?.thumbnail?.source || null;
    }

    async function resolvePlaceImage(place) {
      const key = cacheKey(place);
      if (placeImgCache.has(key)) return placeImgCache.get(key);

      let url = null;
      try { url = await fetchWikipediaThumbnail(place); } catch (e) { url = null; }

      if (!url) url = getPlaceImageFallback(place);

      placeImgCache.set(key, url);
      return url;
    }

    // simple concurrency limiter so we don't spam APIs
    async function mapLimit(items, limit, worker) {
      const results = [];
      const executing = [];
      for (const item of items) {
        const p = Promise.resolve().then(() => worker(item));
        results.push(p);

        if (limit <= items.length) {
          const e = p.then(() => executing.splice(executing.indexOf(e), 1));
          executing.push(e);
          if (executing.length >= limit) await Promise.race(executing);
        }
      }
      return Promise.allSettled(results);
    }

    async function loadDayImages() {
      const imgs = Array.from(document.querySelectorAll("img[data-place]"));

      await mapLimit(imgs, 4, async (img) => {
        const place = img.getAttribute("data-place");
        const url = await resolvePlaceImage(place);
        img.src = url;
      });
    }
    // -------------------------------------------------------------------

    function renderItinerary(plan) {
      const root = document.getElementById("itinerary");
      let html = "";

      plan.forEach(item => {
        const hi = parseHotel(item.hotel);
        const ratingText = (hi.rating && !Number.isNaN(hi.rating)) ? `${hi.rating.toFixed(1)} / 5` : "N/A";
        const areaText = hi.area || "Local area";

        html += `
          <div class="day-row">
            <div class="marker"><div class="dot">${item.day}</div></div>

            <div class="day-card">
              <div class="day-top">
                <div class="title-wrap">
                  <div class="place-title">${item.place}</div>
                  <div class="mini">
                    <span><i class="fa-solid fa-sun"></i> Morning: ${item.place}</span>
                    <span><i class="fa-solid fa-moon"></i> Evening: ${item.nearby || "Local Area"}</span>
                  </div>
                </div>
                <div class="badge-budget"><i class="fa-solid fa-wallet"></i> INR ${dailyBudget.toLocaleString()}</div>
              </div>

              <div class="day-body">
                <div class="thumb">
                  <!-- Place-specific image (Wikipedia first, fallback to Unsplash) -->
                  <img
                    data-place="${String(item.place).replace(/"/g, "&quot;")}"
                    src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=900"
                    alt="${String(item.place).replace(/"/g, "&quot;")}"
                    loading="lazy"
                    onerror="this.src='https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=900'">
                  <div class="thumb-label">Day ${item.day}</div>
                </div>

                <div class="detail">
                  <div class="grid2">
                    <div class="info">
                      <i class="fas fa-hotel"></i>
                      <div><div class="k">Hotel</div><div class="v">${hi.name}</div></div>
                    </div>
                    <div class="info">
                      <i class="fas fa-star"></i>
                      <div><div class="k">Rating</div><div class="v">${ratingText}</div></div>
                    </div>
                    <div class="info">
                      <i class="fas fa-location-dot"></i>
                      <div><div class="k">Area</div><div class="v">${areaText}</div></div>
                    </div>
                    <div class="info">
                      <i class="fas fa-camera"></i>
                      <div><div class="k">Nearby</div><div class="v">${item.nearby || "Local Area"}</div></div>
                    </div>
                  </div>

                  <div class="desc">${item.description || ""}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      if (!html) {
        root.innerHTML = `
          <div class="error">
            <h3>No plan data</h3>
            <p>Plan could not be generated. Please try again.</p>
          </div>
        `;
        return;
      }

      root.innerHTML = html;
    }

    // ================= BACKEND CALL =================
    async function generatePlan() {
      try {
        const response = await fetch("https://max-travel-buddy-t9e9.onrender.com/generate-trip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ destination: to, days: days })
        });

        if (!response.ok) throw new Error("Backend error: " + response.status);

        const data = await response.json();

        if (data && data.status === "error") {
          throw new Error(data.details || "Unknown backend error");
        }

        if (!data || !Array.isArray(data.plan)) {
          console.log("Backend returned:", data);
          throw new Error("Backend did not return plan array");
        }

        planData = data.plan;

        // 1) render
        renderItinerary(planData);

        // 2) load place-specific images
        loadDayImages();

        // 3) map route
        updateMapRoute();

      } catch (error) {
        console.error("Generate plan error:", error);
        document.getElementById("itinerary").innerHTML = `
          <div class="error">
            <h3>Oops! Something went wrong</h3>
            <p>Unable to generate your travel plan. Please try again.</p>
            <div style="margin-top:14px;">
              <button class="action-btn new-plan-btn" onclick="location.reload()" style="max-width:280px;">
                <i class="fas fa-rotate"></i> Try Again
              </button>
            </div>
          </div>
        `;
      }
    }

    // ================= PDF (TEXT-BASED) =================
    function safePdfText(value) {
      return String(value ?? "")
        .replaceAll("₹", "INR ")
        .replaceAll("★", " stars")
        .replace(/[’‘]/g, "'")
        .replace(/[“”]/g, '"')
        .replace(/[–—]/g, "-")
        .replace(/[^\x20-\x7E]/g, "");
    }

    function downloadPDF() {
      if (!planData || planData.length === 0) {
        alert("Plan is still loading (or empty). Please wait and try again.");
        return;
      }

      const jspdfNS = window.jspdf;
      if (!jspdfNS || !jspdfNS.jsPDF) {
        alert("PDF library not loaded. Please refresh the page.");
        return;
      }

      const { jsPDF } = jspdfNS;
      const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
      if (doc.setCharSpace) doc.setCharSpace(0);

      let y = 15;
      const left = 14;
      const pageHeight = 297;
      const bottomMargin = 15;
      const lineGap = 6;

      const ensureSpace = (needed) => {
        if (y + needed > pageHeight - bottomMargin) {
          doc.addPage();
          y = 15;
        }
      };

      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("AI Travel Itinerary", 105, y, { align: "center" });
      y += 10;

      doc.setFont("helvetica", "normal");
      doc.setFontSize(11);
      doc.text(`From: ${safePdfText(from)}`, left, y); y += lineGap;
      doc.text(`Destination: ${safePdfText(to)}`, left, y); y += lineGap;
      doc.text(`Duration: ${days} days`, left, y); y += lineGap;
      doc.text(`Total Budget: INR ${budget.toLocaleString()}`, left, y); y += lineGap;

      y += 3;
      doc.setDrawColor(180);
      doc.line(left, y, 196, y);
      y += 8;

      planData.forEach(item => {
        ensureSpace(28);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text(`Day ${item.day}: ${safePdfText(item.place)}`, left, y);
        y += 7;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);

        const hi = parseHotel(item.hotel);
        const stayLine = doc.splitTextToSize(`Stay: ${safePdfText(hi.name)}`, 180);
        ensureSpace(stayLine.length * lineGap + 5);
        doc.text(stayLine, left, y);
        y += stayLine.length * lineGap;

        doc.text(`Nearby: ${safePdfText(item.nearby || "Local Area")}`, left, y); y += lineGap;
        doc.text(`Budget: INR ${dailyBudget.toLocaleString()}`, left, y); y += lineGap;

        const desc = safePdfText(item.description || "");
        const wrappedDesc = doc.splitTextToSize(desc, 180);
        ensureSpace(wrappedDesc.length * lineGap + 10);
        doc.text(wrappedDesc, left, y);
        y += wrappedDesc.length * lineGap;

        y += 6;
        doc.setDrawColor(220);
        doc.line(left, y, 196, y);
        y += 8;
      });

      const safeTo = safePdfText(to).replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "_") || "Destination";
      doc.save(`Travel_Plan_${safeTo}_${days}days.pdf`);
    }

    // START
    generatePlan();
  </script>
