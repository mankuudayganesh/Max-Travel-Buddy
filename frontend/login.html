<!DOCTYPE html>
<html>

<head>

<title>Login - AI Travel Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

background:
linear-gradient(rgba(2,11,36,0.85),rgba(2,11,36,0.95)),
url("https://images.unsplash.com/photo-1564507592333-c60657eea523");

background-size:cover;
background-position:center;
}

.login-box{
background:rgba(20,30,60,0.7);
padding:50px;
border-radius:20px;
width:400px;
text-align:center;

backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.1);

box-shadow:
0 20px 60px rgba(0,0,0,0.5),
0 0 30px rgba(0,198,255,0.2);
}

.login-box h2{
font-size:32px;
margin-bottom:10px;
background:linear-gradient(90deg,#00c6ff,#ffffff);
background-clip:text;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.login-box p{
color:#aaa;
font-size:14px;
margin-bottom:30px;
}

input{
width:100%;
padding:14px;
margin:12px 0;

border:1px solid rgba(255,255,255,0.2);
border-radius:10px;
background:rgba(255,255,255,0.08);
color:white;
font-size:14px;
}

button{
width:100%;
padding:14px;
margin:10px 0;

background:linear-gradient(90deg,#00c6ff,#0072ff);
border:none;
border-radius:10px;

font-weight:600;
font-size:15px;
cursor:pointer;
color:white;
}

button:hover{
transform:translateY(-2px);
}

.small{
font-size:13px;
color:#aaa;
margin-top:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<h2>AI Travel Planner</h2>
<p>Login to continue your journey</p>

<input id="email" placeholder="Enter Email">

<input id="password" type="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

<button onclick="signup()">Create Account</button>

<p class="small">First time? Click Create Account</p>

</div>

<script>

function signup(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

if(email=="" || password==""){
alert("Enter email and password");
return;
}

localStorage.setItem("userEmail",email);
localStorage.setItem("userPassword",password);

alert("Account Created! Now login.");

}

function login(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

let savedEmail=localStorage.getItem("userEmail");
let savedPassword=localStorage.getItem("userPassword");

if(email===savedEmail && password===savedPassword){

localStorage.setItem("loggedIn",true);

window.location.href="index.html";

}
else{

alert("Invalid email or password");

}

}

</script>

</body>
</html>
